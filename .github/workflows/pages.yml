name: Test and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # pinned image: deploys are known to work here; move deliberately, not via ubuntu-latest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: node -v && npm -v
      - run: npm ci --no-audit --no-fund
      - name: Type check + build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: UI scenarios (WebKit, iPhone)
        run: npm run test:e2e
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # only main, and only when every test passed
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
